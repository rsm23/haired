appId: com.seifelmoulouk.hiarded
productName: Haired
artifactName: Haired-${version}-${os}-${arch}.${ext}
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
directories:
  output: release
files:
  - out/**/*
  - package.json
forceCodeSigning: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  icon: assets/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  extendInfo:
    NSScreenCaptureUsageDescription: Haired captures only the screen region you explicitly select.
win:
  icon: assets/icon.ico
  target:
    - nsis
  azureSignOptions:
    endpoint: ${env.AZURE_TRUSTED_SIGNING_ENDPOINT}
    certificateProfileName: ${env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE}
    codeSigningAccountName: ${env.AZURE_TRUSTED_SIGNING_ACCOUNT}
    publisherName: ${env.WINDOWS_PUBLISHER_NAME}
nsis:
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: ${env.VITE_RELEASE_OWNER}
  repo: ${env.VITE_RELEASE_REPO}
  releaseType: draft
