appId: com.seifelmoulouk.hiarded
productName: Haired
artifactName: Haired-${version}-${os}-${arch}.${ext}
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
directories:
  output: release
files:
  - out/**/*
  - package.json
forceCodeSigning: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    NSScreenCaptureUsageDescription: Haired captures only the screen region you explicitly select.
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: ${env.VITE_RELEASE_OWNER}
  repo: ${env.VITE_RELEASE_REPO}
  releaseType: prerelease
