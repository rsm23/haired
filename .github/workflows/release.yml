name: Branded unsigned desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      release_title:
        description: Descriptive GitHub release title
        required: true
        type: string
      release_notes_path:
        description: Version-controlled Markdown release notes
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS Intel
            os: macos-15
            target: --mac dmg zip --x64
            artifact: mac-x64
            config: electron-builder.preview.yml
          - name: macOS Apple Silicon
            os: macos-15
            target: --mac dmg zip --arm64
            artifact: mac-arm64
            config: electron-builder.preview.yml
          - name: Windows x64
            os: windows-2025
            target: --win nsis --x64
            artifact: windows-x64
            config: electron-builder.preview.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NODE_ENV: production
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VITE_RELEASE_OWNER: ${{ github.repository_owner }}
      VITE_RELEASE_REPO: haired
      VITE_PUBLIC_APP_URL: https://rsm23.github.io/haired/
      VITE_SUPPORT_EMAIL: rahmani@seifelmoulouk.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build release packages
        run: >-
          pnpm --filter @haired/desktop exec electron-builder
          --config ${{ matrix.config }}
          ${{ matrix.target }}
          --publish never
      - name: Reject source maps and secret-like material
        shell: bash
        run: |
          if find apps/desktop/release -type f -name '*.map' | grep -q .; then
            echo "Production source map found"
            exit 1
          fi
          if grep -R -a -E 'sk-proj-|sk-ant-|AIzaSy|whsec_' apps/desktop/release; then
            echo "Secret-like material found in release output"
            exit 1
          fi
      - name: Verify branded macOS package icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="$(find apps/desktop/release -type d -name 'Haired.app' | head -1)"
          test -n "$APP_PATH"
          cmp apps/desktop/assets/icon.icns "$APP_PATH/Contents/Resources/icon.icns"
          for dmg in apps/desktop/release/*.dmg; do
            MOUNT_PATH="$RUNNER_TEMP/haired-dmg-$RANDOM"
            mkdir -p "$MOUNT_PATH"
            hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_PATH" "$dmg"
            cmp apps/desktop/assets/icon.icns "$MOUNT_PATH/Haired.app/Contents/Resources/icon.icns"
            hdiutil detach "$MOUNT_PATH"
          done
      - name: Verify branded Windows installer icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer missing" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($installer.FullName)
          if (-not $icon) { throw "Installer icon missing" }
          $bitmap = $icon.ToBitmap()
          $center = $bitmap.GetPixel([int]($bitmap.Width / 2), [int]($bitmap.Height / 2))
          if ($center.R -lt 170 -or $center.G -gt 170 -or $center.B -gt 120) {
            throw "Installer does not contain the orange Haired mark: $center"
          }
      - uses: anchore/sbom-action@v0
        with:
          path: apps/desktop/release
          format: spdx-json
          output-file: apps/desktop/release/haired-${{ matrix.artifact }}.spdx.json
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd apps/desktop/release
          if command -v shasum >/dev/null 2>&1; then
            HASH_COMMAND=(shasum -a 256)
          else
            HASH_COMMAND=(sha256sum)
          fi
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*.txt' -print0 \
            | sort -z \
            | xargs -0 "${HASH_COMMAND[@]}" \
            > SHA256SUMS-${{ matrix.artifact }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.json
            apps/desktop/release/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate versioned release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES_PATH: ${{ inputs.release_notes_path }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./apps/desktop/package.json').version")"
          test -s "$RELEASE_NOTES_PATH"
      - name: Generate aggregate release checksums
        run: |
          find release-assets -maxdepth 1 -type f ! -name 'SHA256SUMS*.txt' -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            | sed 's#  release-assets/#  #' \
            > release-assets/SHA256SUMS.txt
      - name: Create detailed prerelease, upload every platform, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES_PATH: ${{ inputs.release_notes_path }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft --prerelease --verify-tag --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES_PATH"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$RELEASE_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --prerelease
