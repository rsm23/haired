name: Build unsigned preview packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15
            target: --mac dmg zip --x64
            artifact: mac-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: --mac dmg zip --arm64
            artifact: mac-arm64
          - name: Windows x64
            os: windows-2025
            target: --win nsis --x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NODE_ENV: production
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VITE_PUBLIC_APP_URL: https://rsm23.github.io/haired-releases/
      VITE_RELEASE_OWNER: rsm23
      VITE_RELEASE_REPO: haired-releases
      VITE_SUPPORT_EMAIL: rahmani@seifelmoulouk.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build unsigned preview package
        run: >-
          pnpm --filter @haired/desktop exec electron-builder
          --config electron-builder.preview.yml
          ${{ matrix.target }}
          --publish never
      - name: Reject source maps and secret-like material
        shell: bash
        run: |
          if find apps/desktop/release -type f -name '*.map' | grep -q .; then
            echo "Production source map found"
            exit 1
          fi
          if grep -R -a -E 'sk-proj-|sk-ant-|AIzaSy|whsec_' apps/desktop/release; then
            echo "Secret-like material found in release output"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
